# This file is provided so that the application can be compiled using Twister,
# the Zephyr testing tool. In this file, multiple combinations can be specified,
# so that you can easily test all of them locally or in CI.
common:
  tags:
    - radio
    - sensor_frame

tests:
  # Host build: plain x86-64 executable, sub-second. Fast, but blind to
  # misaligned access (x86 tolerates it). CI runs this one.
  lib.radio.sensor_frame:
    type: unit
    tags:
      - unit
    # The unittest component defaults to -m32; the host here has no 32-bit
    # libgcc. Build the host binary 64-bit instead.
    extra_args:
      - M64_MODE=1
