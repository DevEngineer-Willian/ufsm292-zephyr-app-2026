CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_GPIO=y
CONFIG_SPI=y

# SD por SPI: o driver SDHC SPI e o disco SDMMC ligam sozinhos a partir do
# devicetree, mas os menus precisam estar habilitados.
CONFIG_SDHC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_ACCESS=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Nunca formatar o cartão se a montagem falhar (apagaria os dados)
CONFIG_FS_FATFS_MOUNT_MKFS=n
# Cada arquivo aberto reserva ~550 B de RAM; o teste só usa um por vez
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=1

# snprintf com %f para temp_c e accel
CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
